plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jack.catatan'
    compileSdk 34

    defaultConfig {
        applicationId "com.jack.catatan"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
